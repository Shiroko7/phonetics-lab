[project]
name = "phonetics-lab-backend"
version = "0.1.0"
license = "Apache-2.0"
description = "Forced-alignment and goodness-of-pronunciation scoring for phonetics-lab."
requires-python = ">=3.12"

dependencies = [
    "torch>=2.13,<2.14",
    "transformers>=4.44",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "soundfile>=0.12",
    "numpy>=1.26",
    "praat-parselmouth>=0.4.5",
    "edge-tts>=7.2,<8",
]

# Blackwell (RTX 50xx) is compute capability sm_120. The default PyPI wheels are
# built against an older CUDA that has no kernels for it. CUDA 13.0 provides
# patched PyTorch 2.13 wheels and supports this card with driver 580 or newer.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]

[tool.uv]
package = false
