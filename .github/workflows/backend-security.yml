name: Validate and audit Python backend

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: python scripts/audit_lockfile.py
      - run: python scripts/export_ci_requirements.py > /tmp/phonetics-requirements.txt
      - run: python -m pip install torch==2.13.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r /tmp/phonetics-requirements.txt
      - run: python -m unittest test_scoring test_voice -v
